<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Divine Beads - M.A. Gohar</title>
    <meta name="theme-color" content="#030a16">
    <style>
        :root {
            --app-bg: #030a16;
            --card-bg: radial-gradient(circle, #0a192f 0%, #02060c 100%);
            --gold-glow: #f3ba2f;
            --bead-color: #ffd700;
            --text-gray: #94a3b8;
            --neon-border: #00d2ff;
        }

        body {
            margin: 0; padding: 0;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; width: 100vw;
            background-color: var(--app-bg);
            font-family: 'Segoe UI', sans-serif; color: white;
            user-select: none; overflow: hidden;
        }

        @keyframes neonBorderGlow {
            0% { border-color: #00d2ff; box-shadow: 0 0 20px #00d2ff, inset 0 0 10px #00d2ff; }
            33% { border-color: #f3ba2f; box-shadow: 0 0 25px #f3ba2f, inset 0 0 10px #f3ba2f; }
            66% { border-color: #ff00ff; box-shadow: 0 0 25px #ff00ff, inset 0 0 10px #ff00ff; }
            100% { border-color: #00d2ff; box-shadow: 0 0 20px #00d2ff, inset 0 0 10px #00d2ff; }
        }

        /* Responsive Frame for all screens */
        .phone-frame {
            background: var(--card-bg);
            width: 100%; 
            height: 100vh;
            padding: 15px;
            text-align: center;
            position: relative; 
            border: 4px solid #1e293b; 
            animation: neonBorderGlow 5s linear infinite;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
        }

        .top-container { display: flex; justify-content: space-between; align-items: center; padding: 5px; }
        .side-btn { 
            background: rgba(255,255,255,0.05); 
            border: 1px solid rgba(255,255,255,0.1);
            color: white; padding: 8px 12px; border-radius: 12px; font-size: 0.7rem; cursor: pointer;
            box-shadow: 0 0 5px rgba(0,210,255,0.3);
        }

        .live-stats {
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            padding: 8px;
            font-size: 0.75rem;
            color: var(--text-gray);
            display: flex;
            justify-content: space-around;
            margin: 5px 10px;
            border: 1px solid rgba(0,210,255,0.2);
        }
        
        .volume-control { display: flex; align-items: center; justify-content: center; gap: 10px; }
        .volume-control input { width: 100px; accent-color: var(--gold-glow); }

        .header-stats { display: flex; justify-content: space-between; padding: 0 15px; font-size: 0.9rem; }
        
        .ring-container {
            position: relative; 
            width: min(220px, 50vw); 
            height: min(220px, 50vw); 
            margin: 0 auto;
            display: flex; justify-content: center; align-items: center;
        }

        .bead {
            position: absolute; width: 12px; height: 12px;
            background: radial-gradient(circle at 30% 30%, #fff, var(--bead-color));
            border-radius: 50%; left: 50%; top: 0; 
            transform-origin: 50% min(110px, 25vw);
        }

        .total-display { font-size: 4rem; font-weight: 200; margin: 0; z-index: 10; color: #fff; }

        .dhikr-btn {
            width: 130px; height: 130px; border-radius: 50%; border: 6px solid rgba(255,255,255,0.1);
            background: radial-gradient(circle at 35% 35%, #fcd34d 0%, #b28924 100%);
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
            cursor: pointer; display: flex; justify-content: center; align-items: center; 
            margin: 10px auto; outline: none; flex-shrink: 0;
            transition: transform 0.1s;
        }
        .dhikr-btn:active { transform: scale(0.95); }

        marquee { font-size: 0.8rem; color: var(--text-gray); }

        @media (max-height: 650px) {
            .total-display { font-size: 3rem; }
            .dhikr-btn { width: 100px; height: 100px; }
            .branding-header font { size: 4; }
        }
    </style>
</head>
<body>

    <div class="phone-frame">
        <div class="top-container">
            <button class="side-btn" onclick="reset()">RESET</button>
            <button class="side-btn" onclick="setGoal()">TARGET</button>
        </div>

        <div class="branding-header">
            <font size="5">DIVINE BEADS</font>
            <p style="margin: 5px 0;"><font size="5">پاک تسبیح</font></p>
            <p style="margin: 0;"><b><font size="3">Powered By M.A.Gohar</font></b></p>
        </div>

        <div class="live-stats">
            <span>👥 Community: <b id="totalUsers" style="color:#00d2ff">...</b></span>
            <span>💧 Online: <b id="onlineUsers" style="color:var(--gold-glow)">...</b></span>
        </div>

        <marquee>Sadaqah-e-Jariyah: Share App And earn the Reward till the time of Qayamah; 100% Secure & Child Safe ! No permissions needed.</marquee>

        <div class="volume-control">
            <span>🔈</span>
            <input type="range" id="volSlider" min="0" max="1" step="0.1" value="0.5">
            <span>🔊</span>
        </div>

        <div class="header-stats">
            <div style="text-align: left;">
                Today: <b id="todayCount">0</b><br>
                <div class="side-btn" id="soundBtn" onclick="toggleSound()" style="padding: 4px 8px; margin-top: 5px;">🔊 On</div>
            </div>
            <div style="text-align: right;">
                Target: <b id="targetLabel">100</b><br>
                <div class="side-btn" onclick="shareApp()" style="padding: 4px 8px; margin-top: 5px;">🔗 Share</div>
            </div>
        </div>

        <div class="ring-container">
            <div class="mala-beads-wrap" id="malaWrap" style="position: absolute; width: 100%; height: 100%; transition: transform 0.3s;"></div>
            <h1 class="total-display" id="mainCounter">0</h1>
        </div>

        <button class="dhikr-btn" id="tapBtn">
            <span style="font-size: 1.2rem; color: #4a3700; font-weight: 900;">PRESS</span>
        </button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
        import { getDatabase, ref, onValue, onDisconnect, runTransaction } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCqM0KiV0K29BIFLmRoQoX2KUVdtChrwXE",
            authDomain: "divine-beads.firebaseapp.com",
            databaseURL: "https://divine-beads-default-rtdb.firebaseio.com",
            projectId: "divine-beads",
            storageBucket: "divine-beads.firebasestorage.app",
            messagingSenderId: "589482198444",
            appId: "1:589482198444:web:1a3343eea6ef775fd4a609"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const totalRef = ref(db, 'stats/total_users');
        const onlineRef = ref(db, 'stats/online_now');

        // Total Community Logic
        if (!localStorage.getItem('mag_unique_user')) {
            runTransaction(totalRef, (curr) => (curr || 0) + 1);
            localStorage.setItem('mag_unique_user', 'true');
        }
        onValue(totalRef, (snap) => { document.getElementById('totalUsers').innerText = snap.val() || 0; });

        // Online Users Logic
        runTransaction(onlineRef, (curr) => (curr || 0) + 1);
        onDisconnect(onlineRef).runTransaction((curr) => (curr > 0 ? curr - 1 : 0));
        onValue(onlineRef, (snap) => { document.getElementById('onlineUsers').innerText = snap.val() || 1; });
    </script>

    <script>
        let count = parseInt(localStorage.getItem('mag_count')) || 0;
        let goal = parseInt(localStorage.getItem('mag_goal')) || 100;
        let isMuted = localStorage.getItem('mag_mute') === 'true';
        let appVolume = parseFloat(localStorage.getItem('mag_vol')) || 0.5;

        const mainDisplay = document.getElementById('mainCounter');
        const volSlider = document.getElementById('volSlider');

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playTargetAlert() {
            if (isMuted) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.frequency.setValueAtTime(880, audioCtx.currentTime); 
            gain.gain.setValueAtTime(appVolume, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1);
            osc.start(); osc.stop(audioCtx.currentTime + 1);
            if (navigator.vibrate) navigator.vibrate([300, 100, 300]);
        }

        function updateUI() {
            mainDisplay.innerText = count;
            document.getElementById('todayCount').innerText = count;
            document.getElementById('targetLabel').innerText = goal;
            document.getElementById('malaWrap').style.transform = `rotate(-${count * (360/33)}deg)`;
            
            if (count >= goal && goal > 0) {
                mainDisplay.style.color = "var(--gold-glow)";
                if(count === goal) playTargetAlert();
            } else {
                mainDisplay.style.color = "#fff";
            }
            localStorage.setItem('mag_count', count);
        }

        volSlider.oninput = () => {
            appVolume = volSlider.value;
            localStorage.setItem('mag_vol', appVolume);
        };

        function toggleSound() {
            isMuted = !isMuted;
            localStorage.setItem('mag_mute', isMuted);
            document.getElementById('soundBtn').innerText = isMuted ? '🔇 Off' : '🔊 On';
        }

        function shareApp() {
            const text = `Join Divine Beads Community! My count today: ${count}\nApp Link: ${window.location.href}`;
            window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
        }

        document.getElementById('tapBtn').onclick = () => {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            count++; updateUI();
        };

        function reset() { if(confirm("Reset Count?")) { count = 0; updateUI(); } }
        function setGoal() { 
            let g = prompt("Set Your Target:", goal); 
            if(g) { goal = parseInt(g); updateUI(); localStorage.setItem('mag_goal', goal); } 
        }

        // Generate Beads
        const malaWrap = document.getElementById('malaWrap');
        for (let i = 0; i < 33; i++) {
            const b = document.createElement('div');
            b.className = 'bead';
            b.style.transform = `translateX(-50%) rotate(${i * (360/33)}deg)`;
            malaWrap.appendChild(b);
        }
        updateUI();
    </script>
</body>
</html>
