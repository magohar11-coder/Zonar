<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Divine Beads - M.A. Gohar</title>
    <meta name="theme-color" content="#030a16">
    <style>
        :root {
            --app-bg: #030a16;
            --card-bg: radial-gradient(circle, #0a192f 0%, #02060c 100%);
            --gold-glow: #f3ba2f;
            --bead-color: #ffd700;
            --text-gray: #94a3b8;
        }

        body {
            margin: 0; padding: 0;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; background-color: var(--app-bg);
            font-family: 'Segoe UI', sans-serif; color: white;
            user-select: none; overflow: hidden;
        }

        @keyframes neonBorderGlow {
            0% { border-color: #00d2ff; box-shadow: 0 0 20px #00d2ff, inset 0 0 10px #00d2ff; }
            50% { border-color: #f3ba2f; box-shadow: 0 0 25px #f3ba2f, inset 0 0 10px #f3ba2f; }
            100% { border-color: #00d2ff; box-shadow: 0 0 20px #00d2ff, inset 0 0 10px #00d2ff; }
        }

        .phone-frame {
            background: var(--card-bg);
            width: 90vw; max-width: 340px; height: 92vh; max-height: 700px;
            padding: 20px 15px; border-radius: 40px; text-align: center;
            position: relative; border: 6px solid #1e293b; 
            animation: neonBorderGlow 5s linear infinite;
            display: flex; flex-direction: column; justify-content: space-around;
            box-sizing: border-box;
        }

        .top-container { display: flex; justify-content: space-between; align-items: center; }
        .side-btn { 
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            color: white; padding: 8px 12px; border-radius: 12px; font-size: 0.65rem; cursor: pointer;
        }

        .live-stats-bar {
            background: rgba(0, 210, 255, 0.1);
            border-radius: 10px; padding: 8px; margin: 10px 0;
            font-size: 0.7rem; display: flex; justify-content: space-around;
            border: 1px solid rgba(0, 210, 255, 0.2);
        }

        .header-stats { display: flex; justify-content: space-between; padding: 0 10px; font-size: 0.85rem; color: var(--text-gray); }
        .ring-container { position: relative; width: 180px; height: 180px; margin: 5px auto; display: flex; justify-content: center; align-items: center; }
        .bead { position: absolute; width: 10px; height: 10px; background: radial-gradient(circle at 30% 30%, #fff, var(--bead-color)); border-radius: 50%; left: 50%; top: 0; transform-origin: 50% 90px; }
        .total-display { font-size: 3.5rem; font-weight: 100; margin: 0; z-index: 10; color: #fff; }
        
        .dhikr-btn { 
            width: 120px; height: 120px; border-radius: 50%; 
            background: radial-gradient(circle at 35% 35%, #fcd34d 0%, #b28924 100%); 
            box-shadow: 0 10px 25px rgba(0,0,0,0.6); cursor: pointer; 
            display: flex; justify-content: center; align-items: center; 
            margin: 5px auto; border: none; outline: none;
        }

        @media (max-height: 600px) {
            .ring-container { width: 150px; height: 150px; }
            .bead { transform-origin: 50% 75px; }
            .dhikr-btn { width: 100px; height: 100px; }
        }
    </style>
</head>
<body>

    <div class="phone-frame">
        <div class="top-container">
            <button class="side-btn" id="resetBtn">RESET</button>
            <button class="side-btn" id="targetBtn">TARGET</button>
        </div>

        <div class="branding-header">
            <font size="5">DIVINE BEADS</font><br>
            <font size="4">Powered By M.A.Gohar</font>
        </div>

        <div class="live-stats-bar">
            <span>👥 Community: <b id="totalUsers">...</b></span>
            <span>🔥 Active: <b id="onlineUsers">...</b></span>
        </div>

        <marquee style="font-size: 0.7rem; color: var(--text-gray);">Sadaqah-e-Jariyah: Share App And earn the Reward! No Adult Ads | 100% Safe.</marquee>

        <div class="header-stats">
            <div class="stat-col" style="text-align: left;">
                <span>Today: <b id="todayCount">0</b></span>
                <div class="side-btn" id="soundBtn" style="padding: 3px 6px; margin-top: 5px;">🔊 On</div>
            </div>
            <div class="stat-col" style="text-align: right;">
                <span>Target: <b id="targetLabel">100</b></span>
                <div class="side-btn" id="shareBtn" style="padding: 3px 6px; margin-top: 5px;">🔗 Share</div>
            </div>
        </div>

        <div class="ring-container">
            <div id="malaWrap" style="position: absolute; width: 100%; height: 100%; transition: transform 0.3s;"></div>
            <h1 class="total-display" id="mainCounter">0</h1>
        </div>

        <button class="dhikr-btn" id="tapBtn">
            <span style="font-size: 1rem; color: #4a3700; font-weight: 900;">PRESS</span>
        </button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
        import { getDatabase, ref, onValue, onDisconnect, runTransaction } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCqM0KiV0K29BIFLmRoQoX2KUVdtChrwXE",
            authDomain: "divine-beads.firebaseapp.com",
            databaseURL: "https://divine-beads-default-rtdb.firebaseio.com",
            projectId: "divine-beads",
            storageBucket: "divine-beads.firebasestorage.app",
            messagingSenderId: "589482198444",
            appId: "1:589482198444:web:1a3343eea6ef775fd4a609",
            measurementId: "G-L11D16MBR7"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // --- Community & Live Tracking ---
        const totalRef = ref(db, 'stats/total_users');
        const onlineRef = ref(db, 'stats/online_now');

        if (!localStorage.getItem('mag_registered')) {
            runTransaction(totalRef, (curr) => (curr || 0) + 1);
            localStorage.setItem('mag_registered', 'true');
        }

        onValue(totalRef, (s) => { document.getElementById('totalUsers').innerText = s.val() || 0; });

        runTransaction(onlineRef, (curr) => (curr || 0) + 1);
        onDisconnect(onlineRef).runTransaction((curr) => (curr > 0 ? curr - 1 : 0));
        onValue(onlineRef, (s) => { document.getElementById('onlineUsers').innerText = s.val() || 0; });

        // --- App Logic ---
        let count = parseInt(localStorage.getItem('mag_count')) || 0;
        let goal = parseInt(localStorage.getItem('mag_goal')) || 100;
        let isMuted = localStorage.getItem('mag_mute') === 'true';

        const updateUI = () => {
            document.getElementById('mainCounter').innerText = count;
            document.getElementById('todayCount').innerText = count;
            document.getElementById('targetLabel').innerText = goal;
            document.getElementById('malaWrap').style.transform = `rotate(-${count * (360/33)}deg)`;
            localStorage.setItem('mag_count', count);
        };

        // Button Click Events
        document.getElementById('tapBtn').addEventListener('click', () => {
            count++; updateUI();
            if (navigator.vibrate) navigator.vibrate(50);
        });

        document.getElementById('resetBtn').addEventListener('click', () => {
            if(confirm("Reset Count?")) { count = 0; updateUI(); }
        });

        document.getElementById('targetBtn').addEventListener('click', () => {
            let g = prompt("Set Target:", goal);
            if(g) { goal = parseInt(g); updateUI(); localStorage.setItem('mag_goal', goal); }
        });

        document.getElementById('soundBtn').addEventListener('click', () => {
            isMuted = !isMuted;
            localStorage.setItem('mag_mute', isMuted);
            document.getElementById('soundBtn').innerText = isMuted ? '🔇 Off' : '🔊 On';
        });

        document.getElementById('shareBtn').addEventListener('click', () => {
            window.open(`https://wa.me/?text=Divine Beads App: Sadaqah-e-Jariyah! Join me.`, '_blank');
        });

        // Initialize Mala Beads
        const malaWrap = document.getElementById('malaWrap');
        for (let i = 0; i < 33; i++) {
            const b = document.createElement('div');
            b.className = 'bead';
            b.style.transform = `translateX(-50%) rotate(${i * (360/33)}deg)`;
            malaWrap.appendChild(b);
        }
        updateUI();
    </script>
</body>
</html>
