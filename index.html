<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Divine Beads - M.A. Gohar</title>
    <style>
        :root {
            --app-bg: #030a16;
            --card-bg: radial-gradient(circle, #0a192f 0%, #02060c 100%);
            --bead-color: #ffd700;
            --neon-blue: #00d2ff;
        }

        body {
            margin: 0; padding: 0;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; background-color: var(--app-bg);
            font-family: 'Segoe UI', sans-serif; color: white;
            user-select: none; overflow: hidden;
        }

        .phone-frame {
            background: var(--card-bg);
            width: 90vw; max-width: 340px; height: 92vh; max-height: 700px;
            padding: 20px 15px; border-radius: 40px; text-align: center;
            position: relative; border: 6px solid #1e293b; 
            box-shadow: 0 0 20px var(--neon-blue), inset 0 0 10px var(--neon-blue);
            display: flex; flex-direction: column; justify-content: space-between;
            box-sizing: border-box;
        }

        .top-container { display: flex; justify-content: space-between; padding: 0 10px; }
        
        .side-btn { 
            background: rgba(255,215,0,0.1); border: 1px solid #f3ba2f;
            color: #f3ba2f; padding: 8px 15px; border-radius: 12px; font-size: 0.7rem; cursor: pointer;
            box-shadow: 0 0 5px #f3ba2f;
        }

        /* Pic style Facebook Stats Boxes */
        .stats-box {
            background: rgba(0, 210, 255, 0.05);
            border: 1px solid rgba(0, 210, 255, 0.3);
            border-radius: 8px; padding: 6px; margin: 4px 0;
            font-size: 0.8rem; display: flex; justify-content: space-around;
        }

        .header-stats { display: flex; justify-content: space-between; padding: 5px 15px; font-size: 0.9rem; }

        .ring-container { position: relative; width: 200px; height: 200px; margin: 10px auto; display: flex; justify-content: center; align-items: center; }
        .bead { position: absolute; width: 10px; height: 10px; background: radial-gradient(circle, #fff, var(--bead-color)); border-radius: 50%; left: 50%; top: 0; transform-origin: 50% 100px; }
        .total-display { font-size: 4rem; font-weight: 100; margin: 0; z-index: 10; }

        .dhikr-btn { 
            width: 130px; height: 130px; border-radius: 50%; 
            background: radial-gradient(circle at 35% 35%, #fcd34d 0%, #b28924 100%); 
            box-shadow: 0 10px 25px rgba(0,0,0,0.8); cursor: pointer; 
            border: none; outline: none; display: flex; justify-content: center; align-items: center;
            margin: 0 auto 10px;
        }

        .press-text { font-size: 1.1rem; color: #332600; font-weight: 900; }
    </style>
</head>
<body>

    <div class="phone-frame">
        <div class="top-container">
            <button class="side-btn" id="resetBtn">RESET</button>
            <button class="side-btn" id="targetBtn">TARGET</button>
        </div>

        <div>
            <h2 style="margin: 5px 0 0; letter-spacing: 2px;">DIVINE BEADS</h2>
            <h1 style="margin: 0; color: #fff; font-weight: normal;">پاک تسبیح</h1>
            <p style="margin: 5px 0; font-size: 0.9rem; color: #94a3b8;">Powered By M.A.Gohar</p>
        </div>

        <div class="stats-box">
            <span>👥 Community: <b id="totalUsers" style="color:#00d2ff">...</b></span>
            <span>💧 Online Users: <b id="onlineUsers" style="color:#f3ba2f">...</b></span>
        </div>

        <p style="font-size: 0.7rem; margin: 0; color: #94a3b8;">Sadaqah-e-Jariyah: Share App And earn the Reward!</p>

        <div class="header-stats">
            <div>Today: <b id="todayCount">0</b><br><span class="side-btn" id="soundBtn" style="padding:2px 8px; font-size:0.6rem;">🔊 On</span></div>
            <div>Target: <b id="targetLabel">10</b><br><span class="side-btn" id="shareBtn" style="padding:2px 8px; font-size:0.6rem;">🔗 Share</span></div>
        </div>

        <div class="ring-container">
            <div id="malaWrap" style="position: absolute; width: 100%; height: 100%; transition: transform 0.3s;"></div>
            <h1 class="total-display" id="mainCounter">0</h1>
        </div>

        <button class="dhikr-btn" id="tapBtn">
            <span class="press-text">PRESS</span>
        </button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
        import { getDatabase, ref, onValue, onDisconnect, runTransaction } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCqM0KiV0K29BIFLmRoQoX2KUVdtChrwXE",
            authDomain: "divine-beads.firebaseapp.com",
            databaseURL: "https://divine-beads-default-rtdb.firebaseio.com",
            projectId: "divine-beads",
            storageBucket: "divine-beads.firebasestorage.app",
            messagingSenderId: "589482198444",
            appId: "1:589482198444:web:1a3343eea6ef775fd4a609",
            measurementId: "G-L11D16MBR7"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Firebase Stats Logic
        const totalRef = ref(db, 'stats/total_users');
        const onlineRef = ref(db, 'stats/online_now');

        if (!localStorage.getItem('mag_user')) {
            runTransaction(totalRef, (c) => (c || 0) + 1);
            localStorage.setItem('mag_user', 'true');
        }
        onValue(totalRef, (s) => { document.getElementById('totalUsers').innerText = s.val() || 0; });

        runTransaction(onlineRef, (c) => (c || 0) + 1);
        onDisconnect(onlineRef).runTransaction((c) => (c > 0 ? c - 1 : 0));
        onValue(onlineRef, (s) => { document.getElementById('onlineUsers').innerText = s.val() || 0; });

        // App Functions
        let count = parseInt(localStorage.getItem('mag_count')) || 0;
        let goal = parseInt(localStorage.getItem('mag_goal')) || 10;
        let isMuted = false;

        const updateUI = () => {
            document.getElementById('mainCounter').innerText = count;
            document.getElementById('todayCount').innerText = count;
            document.getElementById('targetLabel').innerText = goal;
            document.getElementById('malaWrap').style.transform = `rotate(-${count * (360/33)}deg)`;
            localStorage.setItem('mag_count', count);
        };

        document.getElementById('tapBtn').onclick = () => {
            count++; updateUI();
            if (navigator.vibrate) navigator.vibrate(50);
        };

        document.getElementById('resetBtn').onclick = () => {
            if(confirm("Reset?")) { count = 0; updateUI(); }
        };

        document.getElementById('targetBtn').onclick = () => {
            let g = prompt("Set Target:", goal);
            if(g) { goal = parseInt(g); updateUI(); localStorage.setItem('mag_goal', goal); }
        };

        document.getElementById('shareBtn').onclick = () => {
            window.open('https://wa.me/?text=Divine Beads App: Sadaqah-e-Jariyah!', '_blank');
        };

        // Create Beads Circle
        const malaWrap = document.getElementById('malaWrap');
        for (let i = 0; i < 33; i++) {
            const b = document.createElement('div');
            b.className = 'bead';
            b.style.transform = `translateX(-50%) rotate(${i * (360/33)}deg)`;
            malaWrap.appendChild(b);
        }
        updateUI();
    </script>
</body>
</html>
